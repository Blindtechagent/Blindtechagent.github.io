<script>
    function calculateAge() {
      var birthYear = parseInt(document.getElementById("birth-year").value);
      var birthMonth = parseInt(document.getElementById("birth-month").value);
      var birthDay = parseInt(document.getElementById("birth-day").value);

      if (isNaN(birthYear) || birthYear < 1900 || birthYear > new Date().getFullYear()) {
        announce("Please enter a valid birth year.");
        return;
      }

      if (isNaN(birthMonth) || birthMonth < 1 || birthMonth > 12) {
        announce("Please enter a valid birth month.");
        return;
      }

      if (isNaN(birthDay) || birthDay < 1 || birthDay > 31) {
        announce("Please enter a valid birth day.");
        return;
      }

      var currentDate = new Date();
      var currentDay = currentDate.getDate();
      var currentMonth = 1 + currentDate.getMonth();
      var currentYear = currentDate.getFullYear();

      var monthDays = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];

      if (birthDay > currentDay) {
        currentDay += monthDays[currentMonth - 1];
        currentMonth -= 1;
      }

      if (birthMonth > currentMonth) {
        currentMonth += 12;
        currentYear -= 1;
      }

      var dayDiff = currentDay - birthDay;
      var monthDiff = currentMonth - birthMonth;
      var yearDiff = currentYear - birthYear;
      var calculatedAge = "Your age is " + yearDiff + " years, " + monthDiff + " months, and " + dayDiff + " days.";
      announce("Age calculated successfully" + calculatedAge);
      document.getElementById("result").innerHTML = calculatedAge;
    }
  </script>
