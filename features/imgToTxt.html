<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://www.w3schools.com/w3css/4/w3.css" rel="stylesheet"/>
<link href="../style.css" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet"/>
<script crossorigin="anonymous" src="https://kit.fontawesome.com/a5db627303.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script src="../others/loading.js"></script>
<title>Text OCR</title>
<style>
    main {
      font-family: Arial, sans-serif;
      background-color: powderblue;
      margin: 0;
      padding: 20px;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    main h2 {
      color: #22A7F0;
      margin-bottom: 20px;
    }

    p {
      margin-bottom: 10px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 5px;
    }

    .file-input-wrapper {
      margin-bottom: 20px;
    }

    input[type="file"] {
      margin-bottom: 10px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background-color: #fff;
      color: #333;
    }

    .ocr-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .ocr-btn {
      padding: 10px 20px;
      background-color: #22A7F0;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ocr-btn:hover {
      background-color: #1a8cc4;
    }

    #previewContainer {
      margin-top: 15px;
      max-width: 300px;
    }

    #previewContainer img {
      max-width: 100%;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      display: none;
    }

    #languageSelect {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background-color: #fff;
      color: #333;
      margin-bottom: 20px;
    }

    #convertBtn {
      padding: 10px 20px;
      background-color: #22A7F0;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }

    #statusContainer {
      margin-top: 10px;
      font-weight: bold;
    }

    .success {
      color: #2ECC71;
    }

    .error {
      color: #FF0000;
    }

    .copy-btn {
      display: none;
      margin-top: 10px;
      padding: 10px 20px;
      background-color: #FF6B6B;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .copy-btn:hover {
      background-color: #E74C3C;
    }
  </style>
<meta content="Explore the Imgtotxt tool on Blind Tech Agent. We provide accessible utilities, educational resources, and games designed for visually impaired users." name="description"/><link href="https://blindtechagent.github.io/features/imgToTxt.html" rel="canonical"/></head>
<body><h1 class="sr-only">Text OCR</h1>
<div aria-live="assertive" class="sr-only" id="sr-announcer">loading, please wait</div>
<div class="preloader">
<div class="index-loader"><div id="loaderInner"></div></div>
<span aria-live="assertive" id="wt">Loading</span>
<div aria-live="polite" id="wt-box"> <div id="welcomeBox"> <pre><span class="welcome">please wait...</span></pre></div></div>
</div>
<div class="body">
<header id="header"></header>
<nav class="w3-bar">
<a class="tab" href="../index.html" role="tab" target="_self">HOME</a>
<a aria-label="Selected, Features" class="tab w3-yellow" href="../features.html" role="tab" target="_self">TOOLS </a>
<a class="tab" href="../education.html" role="tab" target="_self">EDUCATION</a>
<a class="tab" href="../articles.html" role="tab" target="_self">ARTICLES</a>
<a class="tab" href="../games.html" role="tab" target="_self">Games</a>
</nav>
<main id="main">
<div aria-level="2" id="heading-box" role="heading">
<h2>Text OCR</h2>
</div>
<p>Welcome to our Text OCR tool! Effortlessly extract text from your images or camera capture.</p>
<div class="file-input-wrapper">
<label>Choose an option to provide an image:</label>
<div class="ocr-buttons">
<button class="ocr-btn" id="selectImageBtn" type="button"><i class="fas fa-image"></i> Select Image</button>
<button class="ocr-btn" id="captureCameraBtn" type="button"><i class="fas fa-camera"></i> Capture with Camera</button>
<button class="ocr-btn" id="clearImageBtn" style="background-color: #FF6B6B; display: none;" type="button"><i class="fas fa-trash"></i> Clear</button>
</div>
<input accept="image/*" id="fileInput" style="display: none;" type="file"/>
<input accept="image/*" capture="environment" id="cameraInput" style="display: none;" type="file"/>
<p id="imageInputDesc">Supported formats: JPEG, PNG, GIF, or SVG.</p>
<div id="previewContainer">
<img alt="Image preview" id="imagePreview"/>
</div>
</div>
<div>
<p>Language:</p>
<select id="languageSelect">
<option value="auto">Auto-detect</option>
<option value="eng">English</option>
<option value="hin">Hindi</option>
</select>
</div>
<button id="convertBtn">Convert Image to Text</button>
<div aria-live="polite" id="statusContainer" role="status"></div>
<div id="progressWrapper" style="display: none; width: 100%; max-width: 300px; background: #ddd; border-radius: 5px; margin: 10px auto;">
<div id="progressBar" style="width: 0%; height: 10px; background: #22A7F0; border-radius: 5px; transition: width 0.3s;"></div>
</div>
<div aria-atomic="true" class="textCopy" id="resultContainer" style="margin-top: 20px; text-align: left; background: white; padding: 15px; border-radius: 8px; border: 1px solid #ccc; white-space: pre-wrap; display: none;"></div>
<div id="progressBar" style="width: 0%; height: 10px; background: #22A7F0; border-radius: 5px; transition: width 0.3s;"></div>
</main></div>
<div aria-atomic="true" class="textCopy" id="resultContainer"></div>
<button class="copy-btn copyBtn">Copy Text</button>
<div aria-live="assertive" id="announcement" role="status"></div>

<footer id="footer"></footer>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="../others/firebase.js"></script>
<script src="./ITT.js"></script>
<script src="../others/global.js"></script>
<script src="../others/translate.js"></script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" type="text/javascript"></script>
</body>
</html>
