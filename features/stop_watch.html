<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <title>Stopwatch</title>
    <style>
        body {
            background-color: skyblue;
        }

        #timer {
            font-size: 7em;
            margin: 50px 0;
            color: #333;
        }

        button {
            padding: 15px 30px;
            margin: 0 20px;
            font-size: 1.5em;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
        }

        button:hover {
            background-color: #3e8e41;
        }

        button:active {
            background-color: #3e8e41;
            box-shadow: 0 5px #666;
            transform: translateY(4px);
        }

        button:focus {
            outline: none;
            box-shadow: 0 0 0 2px #3e8e41;
        }
    </style>
</head>

<body>
    <div id="sr-announcer" class="sr-only" aria-live="assertive">loading, please wait</div>
    <div class="preloader">
        <div class="index-loader"><div id="loaderInner"></div></div>
        <span id="wt" aria-live="assertive">Loading</span>
        <div id="wt-box" aria-live="polite"> <div id="welcomeBox"> <pre><span class="welcome">please wait...</span></pre></div></div>
    </div>
    <div class="body">
        <header id="header"></header>
            <nav class="w3-bar">
                <a role="tab" href="../index.html" target="_self" class="tab">HOME</a>

                <a role="tab" href="../games.html" target="_self" class="tab">Games</a>
            </nav>
        <main id="main">
            <div id="heading-box" role="heading" aria-level="2">
                <h2>Stop watch</h2>
            </div>
            <p>Our stopwatch is simple to use and perfect for timing various activities. Just click start to begin counting time and click reset to start over.</p>
<div id="timer">00:00</div>
            <div>
                <button id="startStop">Start</button>
                <button id="reset">Reset</button>
                <div id="announcement" role="status" aria-live="assertive"></div>
            </div>
            <audio id="beep" src="https://www.myinstants.com/media/sounds/beep_afknTK7.mp3"></audio>
        </main>
        <footer id="footer"></footer>
