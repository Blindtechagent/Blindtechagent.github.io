<main id="main">
<div aria-level="2" id="heading-box" role="heading">
<h2>Online Calculator by <br/> Blind Tech Agent</h2>
</div>
<table class="calculator">
<tr>
<td colspan="4"><input aria-live="assertive" disabled="" id="result" type="text"/></td>
</tr>
<tr>
<td><button accesskey="c" aria-label="Clear" onclick="clearInput()">AC</button></td>
<td><button accesskey="b" aria-label="Backspace" onclick="backspace()">←</button></td>
<td><button accesskey="s" aria-label="Square Root" onclick="calculate('sqrt(')">√</button></td>
<td><button accesskey="e" aria-label="power" onclick="calculate('pow(')">^</button></td>
</tr>
<tr>
<td><button accesskey="()" aria-label="Left Parenthesis" onclick="addInput('(')">(</button></td>
<td><button accesskey=")" aria-label="Right Parenthesis" onclick="addInput(')')">)</button></td>
<td><button accesskey="p" aria-label="Pi" onclick="calculate('pi')">π</button></td>
<td><button accesskey="f" aria-label="Factors" onclick="calculate('fact(')">!</button></td>
</tr>
<tr>
<td><button accesskey="7" aria-label="7" onclick="calculate('7')">7</button></td>
<td><button accesskey="8" aria-label="8" onclick="calculate('8')">8</button></td>
<td><button accesskey="9" aria-label="9" onclick="calculate('9')">9</button></td>
<td><button accesskey="/" aria-label="Divide" onclick="calculate('/')">÷</button></td>
</tr>
<tr>
<td><button accesskey="4" aria-label="4" onclick="calculate('4')">4</button></td>
<td><button accesskey="5" aria-label="5" onclick="calculate('5')">5</button></td>
<td><button accesskey="6" aria-label="6" onclick="calculate('6')">6</button></td>
<td><button accesskey="*" aria-label="Multiply" onclick="calculate('*')">×</button></td>
</tr>
<tr>
<td><button accesskey="1" aria-label="1" onclick="calculate('1')">1</button></td>
<td><button accesskey="2" aria-label="2" onclick="calculate('2')">2</button></td>
<td><button accesskey="3" aria-label="3" onclick="calculate('3')">3</button></td>
<td><button accesskey="-" aria-label="Minus" onclick="calculate('-')">-</button></td>
</tr>
<tr>
<td><button accesskey="%" aria-label="Percent" onclick="calculate('percent(')">%</button></td>
<td><button accesskey="0" aria-label="0" onclick="calculate('0')">0</button></td>
<td><button accesskey="." aria-label="Decimal Point" onclick="calculate('.')">.</button></td>
<td><button accesskey="+" aria-label="Plus" onclick="calculate('+')">+</button></td>
</tr>
<tr>
<td colspan="4"><button accesskey="=" aria-label="Equals" id="eq" onclick="calculate('=')">=</button></td>
</tr>
</table>
<div aria-live="assertive" id="announcement" role="status"></div>
</main>
<footer id="footer"></footer>
</div>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="../others/firebase.js"></script>
<script>const result = document.getElementById('result');

    function addInput(value) {
      result.value += value;
    }

    function clearInput() {
      result.value = '';
    }

    function backspace() {
      result.value = result.value.slice(0, -1);
    }

    function calculate(operation) {
      if (operation === '=') {
        result.value = eval(result.value);
        announce("result is" + result.value);
      } else if (operation === 'sqrt(') {
        result.value = Math.sqrt(result.value);
      } else if (operation === 'fact(') {
        result.value = factorial(result.value);
      } else if (operation === 'pi') {
        result.value += Math.PI;
      } else if (operation === 'pow(') {
        result.value += '**';
      } else {
        result.value += operation;
      }
    }

    function factorial(num) {
      if (num < 0) {
        return -1;
      } else if (num === 0) {
        return 1;
      } else {
        return (num * factorial(num - 1));
      }
    }
  </script>
