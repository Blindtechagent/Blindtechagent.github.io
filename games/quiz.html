<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Quiz Game</title>
<link href="https://www.w3schools.com/w3css/4/w3.css" rel="stylesheet"/>
<link href="../style.css" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet"/>
<script crossorigin="anonymous" src="https://kit.fontawesome.com/a5db627303.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script src="../others/loading.js"></script>
<style>
        main {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .quiz-container {
            background-color: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 300px;
            max-width: 100%;
            text-align: center;
        }

        main h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        main p {
            margin-bottom: 20px;
        }

        main button {
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            display: block;
            width: 100%;
            margin: 10px 0;
        }

        main button:hover {
            background-color: #45a049;
        }

        .screen {
            display: none;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .screen.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        #final-message {
            margin-top: 10px;
        }

        #category {
            background-color: dodgerblue;
            padding: 8px;
            margin: 16px;
            border: none;
            text-align: center;
            color: white;
            font-size: 16px;
        }
    </style>
<meta content="Explore the Quiz tool on Blind Tech Agent. We provide accessible utilities, educational resources, and games designed for visually impaired users." name="description"/><link href="https://blindtechagent.github.io/games/quiz.html" rel="canonical"/></head>
<body>
<div aria-live="assertive" class="sr-only" id="sr-announcer">loading, please wait</div>
<div class="preloader">
<div class="index-loader"><div id="loaderInner"></div></div>
<span aria-live="assertive" id="wt">Loading</span>
<div aria-live="polite" id="wt-box"> <div id="welcomeBox"> <pre><span class="welcome">please wait...</span></pre></div></div>
</div>
<div class="body">
<header id="header"></header>
<nav class="w3-bar">
<a class="tab" href="../index.html" role="tab" target="_self">HOME</a>
<a class="tab" href="../features.html" role="tab" target="_self">FEATURES </a>
<a class="tab" href="../education.html" role="tab" target="_self">EDUCATION</a>
<a class="tab" href="../articles.html" role="tab" target="_self">ARTICLES</a>
<a aria-label="selected, Games" class="w3-yellow tab" href="../games.html" role="tab" target="_self">Games</a>
</nav>
<main>
<!-- Background Music -->
<audio id="background-music" loop="">
<source src="https://www.myinstants.com/media/sounds/leappad-camera-app-music.mp3" type="audio/mpeg"/>
                Your browser does not support the audio element.
            </audio>
<!-- Start Screen -->
<div class="quiz-container screen active" id="start-screen">
<h1>Quiz Game</h1>
<p>Select any category for the quiz. Test your knowledge across various topics and have fun!</p>
<select id="category"></select>
<button onclick="startQuiz()">Start Quiz</button>
</div>
<!-- Quiz Screen -->
<div class="quiz-container screen" id="quiz-screen">
<div class="quiz-header">
<h2>Quiz Game</h2>
<p id="question-number"></p>
</div>
<div id="quiz-content">
<p aria-live="polite" id="question"></p>
<div id="options" role="group"></div>
</div>
<p id="score">Score: 0</p>
</div>
<!-- End Screen -->
<div class="quiz-container screen" id="end-screen">
<h2 aria-live="assertive">Quiz Over!</h2>
<p id="final-score"></p>
<p id="final-message"></p>
<button onclick="restartQuiz()">Play Again</button>
</div>
<!-- ARIA Live Region for Announcements -->
<div aria-live="assertive" id="announcement" style="position: absolute; left: -9999px;"></div>
</main>
<footer id="footer"></footer>
</div>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="../others/firebase.js"></script>
<script src="quiz-javascript.js"></script>
<script src="../others//global.js"></script>
<script src="../others//auth.js"></script>
<script src="../others/translate.js"></script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" type="text/javascript"></script>
</body>
</html>
